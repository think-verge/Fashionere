name: close-linked-issues

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  repository-projects: write

concurrency:
  group: close-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close-linked-issues:
    name: Update project board on merge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: PVT_kwDOEGBXjs4BbigE
      STATUS_FIELD_ID: PVTSSF_lADOEGBXjs4BbigEzhWSVrk
    steps:
      - name: Mark linked issues as Done on project board
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Extract issue numbers from PR body (Closes/Fixes/Resolves #N)
          ISSUE_NUMBERS=$(echo "$PR_BODY" | grep -oiE '(closes|fixes|resolves)[[:space:]]*#[0-9]+' | grep -oE '[0-9]+' || true)

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No linked issues found in PR body."
            exit 0
          fi

          echo "Found linked issues: $ISSUE_NUMBERS"

          # Get the "Done" option ID for the Status field (query once, reuse)
          DONE_OPTION_ID=$(gh api graphql \
            -f query='
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            ' \
            -f projectId="$PROJECT_ID" \
            --jq '.data.node.fields.nodes[] | select(.name == "Status") | .options[] | select(.name == "Done") | .id'
          )

          if [ -z "$DONE_OPTION_ID" ]; then
            echo "ERROR: Could not find 'Done' option ID in project Status field."
            exit 1
          fi

          echo "Done option ID: $DONE_OPTION_ID"

          for ISSUE_NUMBER in $ISSUE_NUMBERS; do
            echo "---"
            echo "Processing issue #$ISSUE_NUMBER..."

            # Find the project item linked to this issue
            ITEM_ID=$(gh api graphql \
              -f query='
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      projectItems(first: 10) {
                        nodes {
                          id
                          project { id }
                        }
                      }
                    }
                  }
                }
              ' \
              -f owner="$REPO_OWNER" \
              -f repo="$REPO_NAME" \
              -F number="$ISSUE_NUMBER" \
              --jq ".data.repository.issue.projectItems.nodes[] | select(.project.id == \"$PROJECT_ID\") | .id" \
              || true
            )

            if [ -z "$ITEM_ID" ]; then
              echo "Issue #$ISSUE_NUMBER not in project board — skipping."
              continue
            fi

            echo "Setting item $ITEM_ID → Done..."

            gh api graphql \
              -f query='
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }
                  ) {
                    projectV2Item { id }
                  }
                }
              ' \
              -f projectId="$PROJECT_ID" \
              -f itemId="$ITEM_ID" \
              -f fieldId="$STATUS_FIELD_ID" \
              -f optionId="$DONE_OPTION_ID"

            echo "Issue #$ISSUE_NUMBER marked as Done."
          done
