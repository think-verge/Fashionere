name: fast-forward

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

jobs:
  fast_forward_job:
    name: Fast Forward
    if: github.event.issue.pull_request != '' && contains(github.event.comment.body, '/ff')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PR has at least one approval
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const approved = reviews.data.filter(r => r.state === 'APPROVED');
            if (approved.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ **Fast-forward blocked:** This PR requires at least 1 approval from a code owner before it can be merged. Please request a review.',
              });
              core.setFailed('Fast-forward blocked: approval required.');
            }

      - name: Check branch is up to date with main
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const base = pr.data.base.ref;
            const head = pr.data.head.label;
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${base}...${head}`,
            });
            if (comparison.behind_by > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ **Fast-forward blocked:** This branch is **${comparison.behind_by} commit(s) behind \`${base}\`**. Please rebase before merging:\n\n\`\`\`\ngit fetch origin ${base}\ngit rebase origin/${base}\ngit push --force\n\`\`\``,
              });
              core.setFailed(`Fast-forward blocked: branch is ${comparison.behind_by} commit(s) behind ${base}.`);
            }

      # Keep this check's target name in sync with the "CI passed" job
      # defined in .github/workflows/tests.yaml.
      - name: Check PR CI status
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const headSha = pr.data.head.sha;

            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
            });

            const gate = checkRuns.check_runs.find(r => r.name === "CI passed");

            if (!gate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ **Fast-forward blocked:** No `CI passed` check found for the latest commit. Push a commit or wait for CI to run.',
              });
              core.setFailed('Fast-forward blocked: CI check not found.');
              return;
            }

            if (gate.status !== 'completed' || gate.conclusion !== 'success') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ **Fast-forward blocked:** The \`CI passed\` check has not succeeded (status: \`${gate.status}\`, conclusion: \`${gate.conclusion || 'pending'}\`). Please wait for CI to pass before running /ff.`,
              });
              core.setFailed('Fast-forward blocked: CI has not passed.');
            }

      - name: Fast Forward PR
        id: ff-action
        uses: endre-spotlab/fast-forward-js-action@2.1
        with:
          GITHUB_TOKEN: ${{ github.token }}
          failure_message: |-
            Unable to fast forward. Please make sure:
            * Your branch is rebased on top of the current target branch

                git fetch origin main
                git rebase origin/main
                git push --force

            * All required status checks have passed
            * The PR has the required approvals
            * Your commits satisfy any required signing rules
          production_branch: main
